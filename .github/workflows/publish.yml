name: Publish packages to AUR

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Veasel release tag (for example v0.64.4-next.0)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.0"
      - name: Update package versions and release checksums
        id: release
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            result="$(python scripts/update-packages.py "$RELEASE_TAG")"
          else
            result="$(python scripts/update-packages.py)"
          fi
          printf '%s\n' "$result"
          tag="${result##* }"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-next\.[0-9]+)?$ ]] || {
            echo "::error::Unexpected Veasel release tag: $tag"
            exit 1
          }
          {
            echo "tag=$tag"
            echo "branch=automation/aur-mirror"
          } >> "$GITHUB_OUTPUT"
      - name: Regenerate SRCINFO and build the Arch package
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace" archlinux:base-devel bash -lc '
            pacman -Syu --noconfirm --needed namcap shadow
            useradd --create-home builder
            package=create-veasel-code-bin
            cp -a "/workspace/$package" "/tmp/$package"
            chown -R builder:builder "/tmp/$package"
            cd "/tmp/$package"
            su builder -c "cd /tmp/$package && makepkg --printsrcinfo > .SRCINFO"
            install -m 644 .SRCINFO "/workspace/$package/.SRCINFO"
            namcap PKGBUILD
            su builder -c "cd /tmp/$package && makepkg --cleanbuild --noconfirm"
            namcap "/tmp/$package"/*.pkg.tar.zst
            pacman -U --noconfirm "/tmp/$package"/*.pkg.tar.zst
            expected_version="$(sed -n 's/^pkgver=//p' PKGBUILD | sed 's/\.next\./-next./')"
            test "$(veasel --version)" = "Veasel Code $expected_version"
            veasel --help | grep -Fq "Start or reuse the local V backend"
            test -x /usr/lib/veasel-code/veasel-tui
            test -f /usr/share/veasel-code/build.json
          '
      - name: Push package updates to AUR
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo "::error::Set AUR_SSH_PRIVATE_KEY in this repository's Actions secrets."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          umask 077
          trap 'rm -f "$HOME/.ssh/aur_publish"' EXIT
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur_publish"
          unset AUR_SSH_PRIVATE_KEY
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_publish -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          package=veasel-code-bin
          package_directory="create-${package}"
          remote="ssh://aur@aur.archlinux.org/${package}.git"
          directory="$(mktemp -d)"
          git clone "$remote" "$directory"
          cp "$package_directory/PKGBUILD" "$package_directory/.SRCINFO" "$directory/"
          git -C "$directory" config user.name "Ulises Jeremias"
          git -C "$directory" config user.email "ulisescf.24@gmail.com"
          git -C "$directory" add PKGBUILD .SRCINFO
          if git -C "$directory" diff --cached --quiet; then
            echo "${package} is already current on AUR."
            exit 0
          fi
          git -C "$directory" commit -m "Update ${package} to $RELEASE_TAG"
          git -C "$directory" push origin master
      - name: Update GitHub mirror
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          files=(create-veasel-code-bin/PKGBUILD create-veasel-code-bin/.SRCINFO)
          if git diff --quiet -- "${files[@]}"; then
            echo "GitHub package mirror is already current."
            exit 0
          fi
          mirror_directory="$(mktemp -d)"
          cp "${files[@]}" "$mirror_directory/"
          git restore --source=HEAD --staged --worktree -- "${files[@]}"
          if git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
            git switch --create "$RELEASE_BRANCH" --track "origin/$RELEASE_BRANCH"
          else
            git switch --create "$RELEASE_BRANCH"
          fi
          cp "$mirror_directory/PKGBUILD" create-veasel-code-bin/PKGBUILD
          cp "$mirror_directory/.SRCINFO" create-veasel-code-bin/.SRCINFO
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync AUR packages to $RELEASE_TAG"
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi
          cat > "$RUNNER_TEMP/aur-mirror-pr.md" <<EOF
          ## Summary

          Sync the GitHub package mirror to verified AUR package release ${RELEASE_TAG}.

          ## Validation

          The publisher verifies the release manifest, builds and inspects the Arch package, and publishes the matching PKGBUILD and .SRCINFO to AUR. Package CI validates the proposed GitHub mirror. A human reviews and merges this mirror update.

          ## Scope

          Generated PKGBUILD and .SRCINFO only.
          EOF
          pull_request="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$GITHUB_REPOSITORY_OWNER:$RELEASE_BRANCH" \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$pull_request" ]]; then
            gh pr edit "$pull_request" --repo "$GITHUB_REPOSITORY" \
              --title "chore: sync AUR package mirror to $RELEASE_TAG" \
              --body-file "$RUNNER_TEMP/aur-mirror-pr.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main \
              --head "$RELEASE_BRANCH" --draft \
              --title "chore: sync AUR package mirror to $RELEASE_TAG" \
              --body-file "$RUNNER_TEMP/aur-mirror-pr.md"
          fi
