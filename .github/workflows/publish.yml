name: Propose AUR mirror candidate

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Veasel release tag (for example v0.64.4-next.0)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.0"
      - name: Update package versions and release checksums
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            result="$(python scripts/update-packages.py "$RELEASE_TAG")"
          else
            result="$(python scripts/update-packages.py)"
          fi
          printf '%s\n' "$result"
          tag="${result##* }"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-next\.[0-9]+)?$ ]] || {
            echo "::error::Unexpected Veasel release tag: $tag"
            exit 1
          }
          {
            echo "tag=$tag"
            echo "branch=automation/aur-mirror-${tag}"
          } >> "$GITHUB_OUTPUT"
      - name: Regenerate SRCINFO and install-test both Arch packages
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace" archlinux:base-devel bash -lc '
            pacman -Syu --noconfirm --needed namcap shadow
            pacman -S --noconfirm --needed at-spi2-core gtk3 libnotify libsecret libxss libxtst nss util-linux-libs xdg-utils
            useradd --create-home builder
            for package in create-veasel-code-bin veasel-desktop-bin; do
              cp -a "/workspace/$package" "/tmp/$package"
              chown -R builder:builder "/tmp/$package"
              cd "/tmp/$package"
              su builder -c "cd /tmp/$package && makepkg --printsrcinfo > .SRCINFO"
              install -m 644 .SRCINFO "/workspace/$package/.SRCINFO"
              namcap PKGBUILD
              su builder -c "cd /tmp/$package && makepkg --cleanbuild --noconfirm"
              namcap "/tmp/$package"/*.pkg.tar.zst
            done
            pacman -U --noconfirm /tmp/create-veasel-code-bin/*.pkg.tar.zst /tmp/veasel-desktop-bin/*.pkg.tar.zst
            expected="$(sed -n "s/^pkgver=//p" /workspace/create-veasel-code-bin/PKGBUILD | sed "s/\.next\./-next./")"
            test "$(veasel --version)" = "Veasel Code $expected"
            veasel --help | grep -Fq "Start or reuse the local V backend"
            test -x /usr/lib/veasel-code/veasel-tui
            test -f /usr/share/veasel-code/build.json
            test -x /opt/Veasel/veasel-desktop
            test "$(/opt/Veasel/resources/bin/veasel --version)" = "Veasel Code $expected"
            grep -Fxq "Exec=/opt/Veasel/veasel-desktop %U" /usr/share/applications/veasel-desktop.desktop
            test -f /usr/share/icons/hicolor/512x512/apps/veasel-desktop.png
          '
      - name: Update GitHub mirror
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          set -euo pipefail
          gh auth setup-git
          files=(create-veasel-code-bin/PKGBUILD create-veasel-code-bin/.SRCINFO veasel-desktop-bin/PKGBUILD veasel-desktop-bin/.SRCINFO)
          if git diff --quiet -- "${files[@]}"; then
            echo "GitHub package mirror is already current."
            exit 0
          fi
          mirror_directory="$(mktemp -d)"
          for package in create-veasel-code-bin veasel-desktop-bin; do
            mkdir -p "$mirror_directory/$package"
            cp "$package/PKGBUILD" "$package/.SRCINFO" "$mirror_directory/$package/"
          done
          git restore --source=HEAD --staged --worktree -- "${files[@]}"
          if git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "+refs/heads/$RELEASE_BRANCH:refs/remotes/origin/$RELEASE_BRANCH"
            git switch --create "$RELEASE_BRANCH" --track "origin/$RELEASE_BRANCH"
          else
            git switch --create "$RELEASE_BRANCH"
          fi
          for package in create-veasel-code-bin veasel-desktop-bin; do
            cp "$mirror_directory/$package/PKGBUILD" "$package/PKGBUILD"
            cp "$mirror_directory/$package/.SRCINFO" "$package/.SRCINFO"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync AUR packages to $RELEASE_TAG"
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi
          cat > "$RUNNER_TEMP/aur-mirror-pr.md" <<EOF
          ## Summary

          Sync the CLI/TUI and optional Desktop package mirrors to verified Veasel release ${RELEASE_TAG}.

          ## Validation

          The candidate workflow verifies the release manifest, GitHub asset digests, and tag source commit, then builds and inspects both Arch packages. Package CI validates the proposed GitHub mirror. A human reviews and merges this mirror update before the separate publisher can publish the exact approved main revision to AUR.

          ## Scope

          Generated CLI/TUI and Desktop PKGBUILD and .SRCINFO only.
          EOF
          pull_request="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$RELEASE_BRANCH" \
            --json number --jq '.[0].number // empty')"
          if [[ -n "$pull_request" ]]; then
            gh pr edit "$pull_request" --repo "$GITHUB_REPOSITORY" \
              --title "chore: sync AUR package mirror to $RELEASE_TAG" \
              --body-file "$RUNNER_TEMP/aur-mirror-pr.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main \
              --head "$RELEASE_BRANCH" --draft \
              --title "chore: sync AUR package mirror to $RELEASE_TAG" \
              --body-file "$RUNNER_TEMP/aur-mirror-pr.md"
          fi
