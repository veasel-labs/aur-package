name: Package CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.0"
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate PKGBUILD syntax and metadata in Arch Linux
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/workspace:ro" archlinux:base-devel bash -lc '
            pacman -Syu --noconfirm --needed namcap shadow
            useradd --create-home builder
            cp -a /workspace/create-veasel-code-bin /tmp/create-veasel-code-bin
            chown -R builder:builder /tmp/create-veasel-code-bin
            su builder -c "cd /tmp/create-veasel-code-bin && bash -n PKGBUILD && makepkg --printsrcinfo > /tmp/SRCINFO && diff -u .SRCINFO /tmp/SRCINFO && namcap PKGBUILD"
            # Build the *actual* package from the checksum-verified release
            # archives, then install it in a clean Arch container. Metadata
            # validation alone cannot catch broken files or install paths.
            su builder -c "cd /tmp/create-veasel-code-bin && makepkg --cleanbuild --noconfirm"
            pacman -U --noconfirm /tmp/create-veasel-code-bin/veasel-code-bin-*.pkg.tar.zst
            veasel --version | grep -F "Veasel Code "
            test -x /usr/lib/veasel-code/veasel-tui
            /usr/lib/veasel-code/veasel-tui --version | grep -F "Veasel Code Terminal "
            test -f /usr/share/veasel-code/build.json
            # Verify package removal does not leave managed binaries behind.
            pacman -Rns --noconfirm veasel-code-bin
            test ! -e /usr/bin/veasel
            test ! -e /usr/lib/veasel-code/veasel-tui
            test ! -e /usr/share/veasel-code/build.json
          '
