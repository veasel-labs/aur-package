name: Package CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.0"
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare base-version packages for upgrade acceptance
        id: package-history
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          mkdir -p "$RUNNER_TEMP/previous-package"
          has_cli=false
          has_desktop=false
          if [[ -n "$base_sha" && ! "$base_sha" =~ ^0+$ ]]; then
            for package in create-veasel-code-bin veasel-desktop-bin; do
              if ! git cat-file -e "$base_sha:$package/PKGBUILD" 2>/dev/null; then
                echo "$package was not present in base; current package will get clean-install acceptance."
                continue
              fi
              previous_dir="$RUNNER_TEMP/previous-package/$package"
              mkdir -p "$previous_dir"
              for file in PKGBUILD .SRCINFO; do
                git show "$base_sha:$package/$file" > "$previous_dir/$file"
              done
              previous_pkgver="$(sed -n 's/^pkgver=//p' "$previous_dir/PKGBUILD")"
              previous_pkgrel="$(sed -n 's/^pkgrel=//p' "$previous_dir/PKGBUILD")"
              current_pkgver="$(sed -n 's/^pkgver=//p' "$package/PKGBUILD")"
              current_pkgrel="$(sed -n 's/^pkgrel=//p' "$package/PKGBUILD")"
              if [[ "${previous_pkgver}-${previous_pkgrel}" != "${current_pkgver}-${current_pkgrel}" ]]; then
                if [[ "$package" == create-veasel-code-bin ]]; then
                  has_cli=true
                else
                  has_desktop=true
                fi
                echo "Testing $package upgrade from ${previous_pkgver}-${previous_pkgrel} to ${current_pkgver}-${current_pkgrel}."
              else
                echo "$package version unchanged at ${current_pkgver}-${current_pkgrel}; testing clean install/uninstall only."
              fi
            done
          fi
          {
            echo "has_previous_cli=$has_cli"
            echo "has_previous_desktop=$has_desktop"
          } >> "$GITHUB_OUTPUT"
      - name: Validate PKGBUILDs and install both packages in Arch Linux
        env:
          HAS_PREVIOUS_CLI: ${{ steps.package-history.outputs.has_previous_cli }}
          HAS_PREVIOUS_DESKTOP: ${{ steps.package-history.outputs.has_previous_desktop }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e HAS_PREVIOUS_CLI="$HAS_PREVIOUS_CLI" \
            -e HAS_PREVIOUS_DESKTOP="$HAS_PREVIOUS_DESKTOP" \
            -v "$PWD:/workspace:ro" \
            -v "$RUNNER_TEMP/previous-package:/previous:ro" \
            archlinux:base-devel bash /workspace/scripts/accept-package-install.sh
