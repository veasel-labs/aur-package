name: Publish approved package to AUR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact immutable Veasel release tag already merged to main (for example v0.103.2-next.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.0"
      - name: Verify reviewed main metadata and current AUR versions
        id: gate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cli_result="$(python scripts/aur_publish_gate.py check "$RELEASE_TAG" create-veasel-code-bin/PKGBUILD veasel-code-bin)"
          desktop_result="$(python scripts/aur_publish_gate.py check "$RELEASE_TAG" veasel-desktop-bin/PKGBUILD veasel-desktop-bin)"
          printf 'CLI/TUI: %s\nDesktop: %s\n' "$cli_result" "$desktop_result"
          if [[ "$cli_result" == already-current && "$desktop_result" == already-current ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify immutable release checksums against reviewed metadata
        if: steps.gate.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/update-packages.py "$RELEASE_TAG"
          git diff --exit-code -- create-veasel-code-bin/PKGBUILD create-veasel-code-bin/.SRCINFO \
            veasel-desktop-bin/PKGBUILD veasel-desktop-bin/.SRCINFO
      - name: Build and install-test the exact approved packages
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -e HAS_PREVIOUS_CLI=false \
            -e HAS_PREVIOUS_DESKTOP=false \
            -v "$PWD:/workspace:ro" \
            archlinux:base-devel bash /workspace/scripts/accept-package-install.sh
      - name: Publish reviewed packages to AUR and confirm RPC state
        if: steps.gate.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          umask 077
          trap 'rm -f "$HOME/.ssh/aur_publish"' EXIT
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur_publish"
          unset AUR_SSH_PRIVATE_KEY
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_publish -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          for package in create-veasel-code-bin veasel-desktop-bin; do
            if [[ "$package" == create-veasel-code-bin ]]; then
              package_name=veasel-code-bin
            else
              package_name=veasel-desktop-bin
            fi
            directory="$(mktemp -d)"
            remote="ssh://aur@aur.archlinux.org/${package_name}.git"
            remote_pkgbuild="$directory/PKGBUILD"
            if git clone "$remote" "$directory"; then
              echo "Found existing AUR package ${package_name}."
            else
              echo "AUR package ${package_name} is not registered yet; bootstrapping its first reviewed publication."
              rm -rf "$directory"
              directory="$(mktemp -d)"
              git -C "$directory" init --initial-branch=master >/dev/null
              remote_pkgbuild="$directory/PKGBUILD"
            fi
            gate_result="$(python scripts/aur_publish_gate.py check "$RELEASE_TAG" "$package/PKGBUILD" "$package_name" "$remote_pkgbuild")"
            printf '%s: %s\n' "$package_name" "$gate_result"
            if [[ "$gate_result" == already-current ]]; then
              echo "$package_name already has the approved version; skipping duplicate publication."
              continue
            fi
            if ! git -C "$directory" rev-parse --verify HEAD >/dev/null 2>&1; then
              git -C "$directory" checkout --orphan master
            fi
            cp "$package/PKGBUILD" "$package/.SRCINFO" "$directory/"
            git -C "$directory" config user.name "Ulises Jeremias"
            git -C "$directory" config user.email "ulisescf.24@gmail.com"
            git -C "$directory" add PKGBUILD .SRCINFO
            if ! git -C "$directory" diff --cached --quiet; then
              git -C "$directory" commit -m "Update ${package_name} to $RELEASE_TAG"
              git -C "$directory" push origin master
            fi
            python scripts/aur_publish_gate.py wait "$RELEASE_TAG" "$package_name"
          done
